[project]
name = "reactor-backend-python"
version = "0.1.0"
description = "Python migration target for the Reactor backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncmy>=0.2.10,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.38,<3.0",
    "sse-starlette>=2.4,<4.0",
    "structlog>=25.1,<26.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
reactor-contract = "reactor_backend.contracts.cli:main"
reactor-sse-contract = "reactor_backend.contracts.sse_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reactor_backend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external dependency",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reactor_backend"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncmy.*"
ignore_missing_imports = true
