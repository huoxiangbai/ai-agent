# Phase 3B: public featured reads -> Python (reactor-backend-python:8200).
#
# This file is the entire cutover switch. It is included by docker/nginx.conf
# via `include /etc/nginx/featured-python.d/*.conf;` and bind-mounted into the
# frontend container from docker/nginx-featured-python.d/ (see docker-compose.yml).
#
#   cutover:  keep featured-conversations.conf in this directory, then nginx -t && nginx -s reload
#   rollback: mv featured-conversations.conf featured-conversations.conf.disabled, then nginx -t && nginx -s reload
#
# Only these three URIs move. Everything else under /api/ keeps hitting Java
# through `location /api/`. The detail regex is deliberately single-segment so
# that trailing-slash and multi-segment near-misses fall through to Java and keep
# Java's 404 body (Spring BasicErrorController) instead of Starlette's
# {"detail":"Not Found"}.
#
# `location =` wins over the regex and over the /api/ prefix, so /home is never
# swallowed by the detail pattern. Location matching is method-agnostic and
# ignores the query string, so ?limit=6 etc. still land here.
#
# The proxy header block below must stay byte-identical to `location /api/` in
# docker/nginx.conf apart from the upstream name — any divergence would make
# Python see different X-Forwarded-* values than Java did.

location = /api/agent/featured-conversations/home {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /api/agent/featured-conversations {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ~ ^/api/agent/featured-conversations/[^/]+$ {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
