# Phase 4: featured-admin writes -> Python (reactor-backend-python:8200).
#
# This file is the entire cutover switch for the featured-admin write domain.
# It is included by docker/nginx.conf via `include /etc/nginx/featured-python.d/*.conf;`
# and bind-mounted into the frontend container from docker/nginx-featured-python.d/
# (see docker-compose.yml).
#
#   cutover:  keep featured-admin.conf in this directory, then nginx -t && nginx -s reload
#   rollback: mv featured-admin.conf featured-admin.conf.disabled, then nginx -t && nginx -s reload
#
# Only these five URIs move. Everything else under /api/ keeps hitting Java
# through `location /api/`, including every other admin CRUD family.
#
# PRECONDITIONS — do not reload with this file present until BOTH are true:
#   1. REACTOR_PY_FEATURED_ADMIN_WRITE_OWNER=python   (layer 2 writer fence open)
#   2. REACTOR_PY_MYSQL_USER=reactor_py_featured_writer  (layer 1: can INSERT/UPDATE
#      ai_agent_featured_conversation, cannot DELETE or touch any other table)
# With the fence closed the routes answer HTTP 200 + {code:"0001",data:null} and
# write nothing. With reactor_py_ro still in place the writes die at ERROR 1142.
# Rolling back reverses this file FIRST, then closes both fence layers — the route
# flip must land before the write capability is withdrawn so no request can hit a
# Python that is allowed to write while Java is also writing.
#
# The three literal paths (`create`, `update`, `query-list`) use `location =` so a
# trailing slash or a multi-segment near-miss falls through to Java and keeps
# Java's Spring BasicErrorController body instead of Starlette's {"detail": ...}.
# `online` / `offline` take a single path segment for featuredId and are therefore
# single-segment regexes for the same reason.
#
# Location matching is method-agnostic and ignores the query string: `?operator=`
# and `?operator=bob` both land on the online/offline blocks, and a GET against
# `create` is answered 405 by Python with the same `Allow` header Java sends.
#
# The proxy header block below must stay byte-identical to `location /api/` in
# docker/nginx.conf apart from the upstream name — any divergence would make
# Python see different X-Forwarded-* values than Java did.

location = /api/v1/admin/featured-conversations/create {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /api/v1/admin/featured-conversations/update {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /api/v1/admin/featured-conversations/query-list {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ~ ^/api/v1/admin/featured-conversations/online/[^/]+$ {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ~ ^/api/v1/admin/featured-conversations/offline/[^/]+$ {
    proxy_pass http://reactor_backend_python;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
